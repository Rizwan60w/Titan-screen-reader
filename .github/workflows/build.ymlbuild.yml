name: Build APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip and Setup
        run: |
          unzip -o TitanScreenReader_WebBuild.zip
          cd TitanScreenReader
          chmod +x gradlew || true

      - name: Build APK
        run: |
          cd TitanScreenReader
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Titan-Screen-Reader-APK
          path: TitanScreenReader/app/build/outputs/apk/debug/*.apk
